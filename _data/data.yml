projects:
  title: Technical Stack
  intro: >
    I have successfully delivered scalable cloud-native solutions using a comprehensive range of modern technologies and platforms across the full software development lifecycle.
  assignments:
    - title: "Languages:"
      tagline: >
        C#, TypeScript, JavaScript, Go, Python, SQL

    - title: "Backend:"
      tagline: >
        .NET Core, ASP.NET Core, Entity Framework Core, MediatR, gRPC, REST, OpenAPI/Swagger

    - title: "Frontend:"
      tagline: >
        React, Angular, HTML5, CSS/SASS, SPA Development

    - title: "Messaging & Eventing:"
      tagline: >
        Kafka, RabbitMQ, MQTT, Azure Service Bus, Event Hubs

    - title: "Observability:"
      tagline: >
        OpenTelemetry, Serilog, Prometheus, Grafana, Jaeger, Application Insights

    - title: "Cloud & DevOps:"
      tagline: >
        Azure (AKS, Functions, App Service, Event Grid, Key Vault), AWS (EKS, Lambda, API Gateway), Docker, Kubernetes, Terraform, GitLab CI/CD, Azure DevOps

    - title: "Databases & Caching:"
      tagline: >
        SQL Server, PostgreSQL, MongoDB, Redis

    - title: "Security:"
      tagline: >
        OAuth2, OpenID Connect, Keycloak, JWT, mTLS

    - title: "Practices:"
      tagline: >
        Domain-Driven Design (DDD), Clean Architecture, Microservices, Test-Driven Development (TDD), CI/CD, Agile (Scrum/Kanban)

    - title: "AI & Developer Tools:"
      tagline: >
        ChatGPT, Cursor AI, Google Gemini, GitHub Copilot, OpenAI GPT models, Azure OpenAI, LangChain, MCP, Vector Search (Redis/Pinecone) — applied for AI-assisted development, architecture reasoning, and intelligent workflows (RAG, embeddings, documentation automation)

    - title: "Tooling & Productivity:"
