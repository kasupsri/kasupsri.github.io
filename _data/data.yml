career-profile:
  title: Career Profile
  summary: >
    Results-driven Senior Software Engineer with 13+ years of experience delivering scalable, cloud-native systems across healthcare, finance, and enterprise domains. Expert in .NET Core microservices, React/Angular SPAs, and Azure-based distributed architectures. Adept at transforming complex business requirements into high-performing, maintainable solutions through Clean Architecture, DDD, and DevOps automation. Recognized for mentoring teams, improving system reliability, and driving measurable gains in performance, quality, and delivery speed.

education:
  title: Education
  info:
    - degree: Bachelor of Science — Information Technology
      university: Curtin University of Technology, Australia
      time: 2009 - 2012
      details: |
        Completed a comprehensive program focused on software engineering, databases, networks, and web technologies. 
        Gained a strong foundation in both theoretical and applied aspects of information technology.
        Participated in team-based projects, developing practical skills in collaboration, systems design, and application development.

experiences:
  title: Work Experience
  info:
    - role: Product Development Engineer
      time: April 2023 - Present
      company: Rauland Australia - Melbourne
      details: |
        Rauland is a leading healthcare technology provider serving 400+ Australian healthcare organizations with mission-critical communication and workflow solutions.

        **Responsibilities:**

        - Designed and developed 9+ .NET Core microservices for the Reach Duress System using Clean Architecture, powering mobile & web clients with scalable, event-driven APIs handling 10k+ daily nurse-call events.
        - Refactored and extended core services, optimizing database queries and improving reliability to cut API latency by 35%, while enforcing consistent coding and architectural standards.
        - Developed reusable NuGet packages and defined event-bus contracts (MQTT, RabbitMQ) to enable real-time communication across 15+ distributed services, reducing integration effort by 40%.
        - Enhanced clinician-facing SPAs (React/Angular) with secure authentication and modular UI components, reducing onboarding time by 30% and improving workflow efficiency.
        - Contributed to architecture design, documentation, and code reviews; increased test coverage by 25% and improved defect turnaround through structured observability and QA collaboration.
        - Partnered with DevOps to containerize and automate deployments via GitLab CI/CD, accelerating release cycles by 30%.
        - Won "Best Pitch" – Rauland Hackday 2023 for CareNet, a wearable remote-vitals monitoring prototype delivered in 48 hours.

    - role: Senior Software Engineer
      time: February 2022 – March 2023
      company: PALO-IT, Singapore
      details: |
        PALO IT is a global innovation consultancy helping enterprises adopt Agile methodologies, modern engineering, and DevOps practices to drive digital transformation.

        **Responsibilities:**

        - Led a cross-functional team of 8 engineers across Singapore, Vietnam, and India, collaborating closely with product owners, data analysts, and operations teams to align technical delivery with business goals.
        - Implemented a machine-learning-based matchmaking engine, improving user routing accuracy and driving a 30% reduction in misdirected customer queries while increasing site engagement.
        - Designed and developed 10+ backend microservices and frontend applications using TypeScript for the Dealcierge project at Standard Chartered Ventures.
        - Mentored 6 junior developers, improving productivity and achieving top performance ratings through hands-on guidance and code reviews.
        - Introduced code-quality review sessions, reducing SonarQube-detected bugs by 25% and elevating system maintainability.
        - Built Clean Architecture microservices (.NET Core) for the IHiS Health Discovery project, enabling submission of 1.3 million+ vital signs since its launch in 2022.
        - Developed a Cron-based scheduling service generating automated alerts for 24000+ users, improving system responsiveness and reliability.

        <!-- **Technical Stack:**

        `Backend:` .NET Core, NodeJS (TypeScript), Go, Java

        `Frontend:` ReactJS

        `Cloud:` Azure, AWS

        `DevOps:` Azure DevOps, GitHub Actions, SonarQube

        `Database:` PostgreSQL, Redis, MongoDB

        `Other:` Prometheus, Kubernetes, Docker, Serverless, Kong API Gateway -->

    - role: Senior Software Engineer
      time: November 2017 – January 2022
      company: Celiveo Pvt Ltd, Singapore
      details: |
        Celiveo is an enterprise print management and security software company providing solutions for secure document release and access management.

        **Responsibilities:**

        - Modernized solution architecture and migrated legacy ASP.NET systems to Azure and .NET Core microservices, improving product performance by 30% and enabling full cloud readiness.
        - Implemented SOLID design principles and refactored core components to enhance maintainability, scalability, and code consistency across distributed systems.
        - Streamlined the development lifecycle by introducing branching strategies, CI/CD pipelines (Azure DevOps), and code quality tools (SonarQube), cutting build times by 50% and improving release reliability.
        - Supervised the R&D team throughout product releases, performing code reviews, defect analysis, and client deployment coordination to ensure smooth production rollouts.
        - Optimized SQL database structure and queries, boosting system stability and performance by 25%.
        - Established data security and compliance standards, increasing client satisfaction and contributing to a 50% rise in repeat business.

        <!-- **Technical Stack:**

        `Backend:` .NET Core, SQL Server, ASP.NET, SonarQube

        `DevOps:` Azure DevOps Pipelines, Git, Docker

        `Database:` MS SQL Server

        `Practices:` CI/CD, SOLID principles, Agile Scrum -->


    - role: System Analyst (.NET)
      time: October 2016 – October 2017
      company: NCS Pvt Ltd, Singapore
      details: |
        NCS is a leading information and communications technology service provider offering end-to-end IT solutions for government and commercial sectors in the APAC region.

        **Responsibilities:**

        - Expanded the Singapore Government-Paid Leave System to include the Adoption Leave Scheme, successfully supporting the nationwide rollout and policy adoption.
        - Developed SSIS data synchronization packages to integrate with government backend services, eliminating 100% of manual data entry errors and improving data accuracy.
        - Deployed applications across client environments and trained QA teams, increasing client satisfaction and reducing post-deployment issues by 40%.

        <!-- **Technical Stack:**

        `Backend:` .NET, SSIS

        `Database:` MS SQL Server

        `Practices:` Agile, On-site client delivery -->


    - role: Senior Software Engineer
      time: March 2013 – October 2016
      company: Hitachi Digital Payment Solutions Ltd, Sri Lanka
      details: |
        Hitachi DPS delivers cutting-edge payment and banking solutions with a focus on financial technology products, including ATM, POS, and digital banking systems.

        **Responsibilities:**

        - Developed ATM software compliant with CEN XFS standards, successfully deployed across multiple banking clients.
        - Integrated software across multi-vendor ATM models, expanding hardware compatibility and increasing product offerings by 30%.
        - Conducted security analysis and ensured full PCI-DSS compliance, achieving official certification across all applicable modules.
        - Planned and supervised ATM software deployments, delivering 100% on-time releases and reducing post-deployment issues by 40%.
        - Collaborated with offshore engineering teams to implement new features, reducing feature delivery time by 30% and improving communication efficiency by 20%.

        <!-- **Technical Stack:**

        `Standards:` CEN XFS, PCI-DSS

        `Backend:` C++, C#, .NET

        `Practices:` On-site deployments, Cross-functional collaboration -->


    - role: Associate Technology Engineer
      time: March 2012 - February 2013
      company: Virtusa Pvt Ltd - Sri Lanka
      details: |
        Virtusa is a global provider of digital business strategy, digital engineering, and IT services and solutions, serving Global 2000 enterprises and software vendors.

        **Responsibilities:**

        - Enhanced the CitiBank Self-Service web application, enabling customer inquiries and complaints from multiple channels and improving satisfaction by 25%.
        - Upgraded CitiBank transaction modules, ensuring a 100% successful rollout of new transaction types across the platform.
        - Collaborated with offshore U.S. teams on API configuration and system integration, reducing development and integration time by 30%.

