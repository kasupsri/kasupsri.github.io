career-profile:
  title: Career Profile
  summary: >
    Senior Software Engineer with over 13 years of experience delivering scalable backend microservices and modern frontend Single Page Applications. Proven track record in leading cross-functional teams, implementing Agile and DevOps practices, and driving innovation in cloud-native solutions across healthcare, fintech, and enterprise SaaS domains. Adept at hands-on coding, solution architecture, and mentoring developers. Known for optimizing legacy systems, integrating real-time communications, and delivering high-quality software in fast-paced environments. Passionate about experimenting with emerging technologies and committed to engineering best practices.

education:
  title: Education
  info:
    - degree: Bachelor of Science — Information Technology
      university: Curtin University of Technology, Australia
      time: 2009 - 2012
      details: |
        Completed a comprehensive program focused on software engineering, databases, networks, and web technologies. 
        Gained a strong foundation in both theoretical and applied aspects of information technology.
        Participated in team-based projects, developing practical skills in collaboration, systems design, and application development.

experiences:
  title: Work Experience
  info:
    - role: Product Development Engineer
      time: April 2023 - Present
      company: Rauland Australia - Melbourne
      details: |
        Rauland is a leading healthcare technology provider serving 400+ Australian healthcare organizations with mission-critical communication and workflow solutions.

        **Responsibilities:**

        - Designed and developed 9+ .NET Core microservices for the Reach Duress System using Clean Architecture, powering mobile and web clients with scalable, event-driven APIs.
        - Refactored and enhanced existing services while developing new features and systems; optimized database performance, improved reliability, and enforced consistent coding and architectural standards across microservices.
        - Developed reusable NuGet packages and defined event-bus contracts using MQTT and RabbitMQ to enable real-time communication between distributed services.
        - Contributed to architecture design, documentation, and code reviews; drove continuous improvement through issue investigations, feasibility studies, and QA collaboration.
        - Built and enhanced single-page applications (React/Angular) with secure authentication, modular UI components, and workflow improvements supporting clinicians.
        - Collaborated with DevOps to containerize and automate deployments via GitLab pipelines, supporting efficient CI/CD for Dockerized microservices.
        - Won "Best Pitch" at Rauland Hackday for CareNet, a wearable-based remote vitals monitoring prototype delivered in 48 hours.

        **Technical Stack:**

        `Backend:` .NET Core, Clean Architecture, MQTT, RabbitMQ, NuGet Packages

        `Frontend:` React, Angular, SPA Development

        `DevOps:` Docker, GitLab CI/CD, Containerization

        `Architecture:` Microservices, Event-Driven APIs, Event-Bus Contracts

    - role: Senior Software Engineer
      time: February 2022 - March 2023
      company: PALO-IT - Singapore
      details: |
        PALO IT is a global innovation consultancy helping enterprises adopt Agile methodologies, modern engineering, and DevOps practices to drive digital transformation.

        **Responsibilities:**

        - Managed a cross-functional team of 8 across Singapore, Vietnam, and India; collaborated closely with product, operations, and marketing teams.
        - Designed and developed over 10 microservice backend APIs and frontend applications using TypeScript for the Dealcierge project at Standard Chartered Ventures.
        - Implemented a machine learning-based matchmaking engine, reducing misdirected customer service queries by 30%.
        - Mentored 6 junior developers in Vietnam to achieve the highest performance ratings through technical coaching and support.
        - Initiated and conducted code quality review sessions, resulting in a 25% reduction in SonarQube-detected bugs and improved system code quality.
        - Developed Clean Architecture microservices (.NET Core) for the IHiS Health Discovery project, leading to over 1.3 million vitals submitted.
        - Created a Cron job scheduling service for generating alerts for more than 24,000 users.

        <!-- **Technical Stack:**

        `Backend:` .NET Core, NodeJS (TypeScript), Go, Java

        `Frontend:` ReactJS

        `Cloud:` Azure, AWS

        `DevOps:` Azure DevOps, GitHub Actions, SonarQube

        `Database:` PostgreSQL, Redis, MongoDB

        `Other:` Prometheus, Kubernetes, Docker, Serverless, Kong API Gateway -->

    - role: Senior Software Engineer
      time: November 2017 - January 2022
      company: Celiveo Pvt Ltd - Singapore
      details: |
        Celiveo is an enterprise print management and security software company providing solutions for secure document release and access management.

        **Responsibilities:**

        - Revamped and optimized Celiveo products by applying SOLID principles and migrating from legacy ASP.NET to .NET Core microservices, improving product performance by 30%.
        - Streamlined software development by implementing branching strategies, build pipelines, CI/CD with Azure DevOps, and static analysis using SonarQube.
        - Automated 5+ build pipelines, achieving a 50% reduction in build time.
        - Supervised the R&D team throughout the release cycle: code reviews, defect triage, and production deployments.
        - Enhanced database performance and stability by redesigning tables and optimizing queries, achieving a 25% system performance boost.
        - Ensured compliance with client data security standards, leading to a 50% increase in repeat business due to improved client satisfaction.

        <!-- **Technical Stack:**

        `Backend:` .NET Core, SQL Server, ASP.NET, SonarQube

        `DevOps:` Azure DevOps Pipelines, Git, Docker

        `Database:` MS SQL Server

        `Practices:` CI/CD, SOLID principles, Agile Scrum -->


    - role: System Analyst (.NET)
      time: October 2016 - October 2017
      company: NCS Pvt Ltd - Singapore
      details: |
        NCS is a leading information and communications technology service provider offering end-to-end IT solutions for government and commercial sectors in the APAC region.

        **Responsibilities:**

        - Expanded the Singapore Government-Paid Leave system to support the Adoption Leave Scheme, ensuring smooth launch and adoption of the new program.
        - Developed and deployed SSIS packages to sync with backend government services, eliminating data entry errors.
        - Provided on-site deployment and training to QA teams, improving client satisfaction and reducing post-deployment issues by 40%.

        <!-- **Technical Stack:**

        `Backend:` .NET, SSIS

        `Database:` MS SQL Server

        `Practices:` Agile, On-site client delivery -->


    - role: Senior Software Engineer
      time: March 2013 - October 2016
      company: Hitachi Digital Payment Solutions Ltd - Sri Lanka
      details: |
        Hitachi DPS delivers cutting-edge payment and banking solutions with a focus on financial technology products, including ATM, POS, and digital banking systems.

        **Responsibilities:**

        - Designed and implemented ATM software compliant with CEN XFS standards, leading to a successful product launch.
        - Integrated ATM software across different vendor models and hardware modules, expanding the product range by 30%.
        - Conducted PCI-DSS security analysis and ensured software certification compliance.
        - Managed and planned ATM deployments at client sites, achieving 100% on-time delivery and reducing post-deployment issues by 40%.
        - Collaborated with offshore teams to implement features and reduce delivery timelines by up to 30%, improving coordination and team efficiency.

        <!-- **Technical Stack:**

        `Standards:` CEN XFS, PCI-DSS

        `Backend:` C++, C#, .NET

        `Practices:` On-site deployments, Cross-functional collaboration -->


    - role: Associate Technology Engineer
      time: March 2012 - February 2013
      company: Virtusa Pvt Ltd - Sri Lanka
      details: |
        Virtusa is a global provider of digital business strategy, digital engineering, and IT services and solutions, serving Global 2000 enterprises and software vendors.

        **Responsibilities:**

        - Enhanced the Citi Bank Self-Service web application to support customer inquiries and complaints, boosting customer satisfaction by 25%.
        - Added support for new transaction types, enabling a 100% successful launch.
        - Assisted offshore USA teams with system configurations and API implementations, reducing development and integration time by 30%.

